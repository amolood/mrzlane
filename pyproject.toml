[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrzlane"
version = "0.1.0"
description = "MRZ-first passport and ID OCR with cross-validated, zero-error field extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ocr", "mrz", "passport", "id-card", "icao-9303", "document-recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python-headless",
    "numpy",
    "pillow",
    "paddleocr",
    "paddlepaddle",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]", "python-multipart"]

[project.urls]
Homepage = "https://github.com/OWNER/mrzlane"
Issues = "https://github.com/OWNER/mrzlane/issues"

[tool.setuptools.packages.find]
where = ["src"]
